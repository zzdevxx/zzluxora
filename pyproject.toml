[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zzluxora"
version = "10.1.0"
description = "Audio-Reactive Intelligent Stage Lighting Console with Art-Net 4 DMX512 Output"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Andreas Christwara", email = "contact@zzdree.my.id" },
]
dependencies = [
    "numpy>=1.22.0",
    "soundfile>=0.12.1",
    "yt-dlp>=2025.1.1",
    "imageio-ffmpeg>=0.5.1",
    "PySide6>=6.5.0",
]

[project.urls]
Portal = "https://zzdree.my.id/zzluxora/"
Repository = "https://github.com/zzdevxx/zzluxora"
Firmware = "https://gitlab.com/zzdevxx/esp32-artnet-dmx"
Fixtures = "https://github.com/zzdevxx/zz-fixture"
Thesis = "https://gitlab.com/zzdevxx/zzluxora-thesis"
